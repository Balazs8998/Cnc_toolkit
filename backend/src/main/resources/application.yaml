spring:
  application:
    name: cnc-toolkit-backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

