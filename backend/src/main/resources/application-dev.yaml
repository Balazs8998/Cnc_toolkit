spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cnc_toolkit}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:cnc_user}
    password: ${MYSQL_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.cnctoolkit.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

