<section class="simulator-page">
  <header class="simulator-header">
    <div class="simulator-header__content">
      <h1>CNC Simulator</h1>

      <p class="simulator-header__description">
        Enter a CNC program and visualize the tool movement in the X–Z plane.
      </p>
    </div>

    <div class="machine-badge">
      <span class="machine-badge__light"></span>

      <div>
        <span class="machine-badge__label">
          Machine mode
        </span>

        <strong>
          Turning / X–Z
        </strong>
      </div>
    </div>
  </header>

  <div class="simulator-workspace">
    <aside class="simulator-workspace__editor">
      <app-code-editor
        (programSubmitted)="loadProgram($event)"
      />
    </aside>

    <main class="simulator-workspace__monitor">
      <app-canvas-view />
    </main>
  </div>
</section>
