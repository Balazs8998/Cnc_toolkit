<section
  id="stock-setup"
  class="stock-setup-panel stock-setup-panel--open"
>
  <header class="stock-setup-panel__header">
    <div>
      <span>Raw stock dimensions</span>
      <strong>Workpiece setup</strong>
    </div>

    <span class="stock-setup-panel__direction">
      Material: Z−
    </span>
  </header>

  <div class="stock-setup-grid">
    <label class="stock-field">
      <span>Diameter</span>

      <div class="stock-field__control">
        <input type="number" min="0" step="0.001" value="20">
        <span>mm</span>
      </div>
    </label>

    <label class="stock-field">
      <span>Length</span>

      <div class="stock-field__control">
        <input type="number" min="0" step="0.001" value="60">
        <span>mm</span>
      </div>
    </label>

    <label class="stock-field">
      <span>Radial clearance</span>

      <div class="stock-field__control">
        <input type="number" min="0" step="0.001" value="2">
        <span>mm</span>
      </div>
    </label>

    <label class="stock-field">
      <span>Z clearance</span>

      <div class="stock-field__control">
        <input type="number" min="0" step="0.001" value="5">
        <span>mm</span>
      </div>
    </label>
  </div>
</section>
