<section
  id="stock-setup"
  class="stock-setup-panel stock-setup-panel--open"
>
  <header class="stock-setup-panel__header">
    <div>
      <span>Raw stock dimensions</span>
      <strong>Workpiece setup</strong>
    </div>

    <span class="stock-setup-panel__direction">
      Material: Z−
    </span>
  </header>

  <form [formGroup]="stockSetupForm" (ngSubmit)="submitStockSetup()">
  <div class="stock-setup-grid">
    <label class="stock-field">
      <span>Diameter</span>

      <div class="stock-field__control">
        <input
          formControlName="diameter"
          type="number" min="0" >
        <span>mm</span>
      </div>
    </label>

    <label class="stock-field">
      <span>Work length</span>

      <div class="stock-field__control">
        <input
          formControlName="workLength"
          type="number" min="0" >
        <span>mm</span>
      </div>
    </label>

    <label class="stock-field">
      <span>Radial clearance</span>

      <div class="stock-field__control">
        <input
          formControlName="radialClearance"
          type="number"
          min="0"

        />
        <span>mm</span>
      </div>
    </label>

    <label class="stock-field">
      <span>Z clearance</span>

      <div class="stock-field__control">
        <input
          formControlName="axialClearance"
          type="number"
          min="0"
          step="0.5"
        />
        <span>mm</span>
      </div>
    </label>
  </div>
    <div class="stock-setup-actions">
      <button
        [disabled]="stockSetupForm.invalid"
        class="stock-setup-actions__save"
        type="submit"
      >
        Save setup
      </button>
    </div>

  </form>
</section>
